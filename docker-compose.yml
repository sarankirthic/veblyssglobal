# Local dev orchestration for apps/api + its datastores.
# apps/web and apps/admin aren't built yet (see docs/ARCHITECTURE.md) — add
# their services here once they exist, per the monorepo layout in §3.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: veblyss
      POSTGRES_PASSWORD: veblyss
      POSTGRES_DB: veblyss
    ports:
      - "5432:5432"
    volumes:
      - veblyss_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veblyss"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://veblyss:veblyss@postgres:5432/veblyss
      REDIS_URL: redis://redis:6379/0
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  cloudflared:
    container_name: cloudflare-tunnel
    image: 'cloudflare/cloudflared:latest'
    restart: unless-stopped
    command: 'tunnel --no-autoupdate run'
    environment:
      - 'TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN?set in .env}'

volumes:
  veblyss_pg_data:
