# Full-stack orchestration: postgres + redis + api + web. Written to run
# equally well as `docker compose up` for local dev (see
# docker-compose.override.yml, auto-merged, for host-port publishing) and as
# a Dokploy "Docker Compose" resource: no service here publishes a fixed host
# port, since Dokploy routes traffic through its own Traefik proxy on its own
# internal network — a hardcoded `ports: "4000:4000"` fights that, and risks
# colliding with other apps/services already using that port on a shared
# Dokploy host. `api`/`web` still declare a bare container port (Dokploy
# reads this to know what to route to); postgres/redis don't need one at all
# — nothing outside this stack should reach them directly.
services:
  veblyss.postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: veblyss
      POSTGRES_PASSWORD: veblyss
      POSTGRES_DB: veblyss
    volumes:
      - veblyss_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veblyss"]
      interval: 5s
      timeout: 5s
      retries: 10

  veblyss.redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  veblyss.api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    # No env_file here on purpose — apps/api/.env is gitignored (real secrets,
    # never committed) so it never exists on a host that deploys by cloning
    # this repo (Dokploy). Every var below is interpolated from the root .env
    # instead — same convention already used for
    # NEXT_PUBLIC_API_URL/CLOUDFLARE_TUNNEL_TOKEN below. Set these in
    # Dokploy's own env var UI, which writes a .env next to
    # docker-compose.yaml that Compose reads automatically for ${VAR}
    # substitution.
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY?set in .env}
      DATABASE_URL: postgresql+psycopg2://veblyss:veblyss@veblyss.postgres:5432/veblyss
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-veblyss_session}
      SESSION_LIFETIME_DAYS: ${SESSION_LIFETIME_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS?set in .env}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-veblyss-media}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      REDIS_URL: redis://veblyss.redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "4000"
    depends_on:
      veblyss.postgres:
        condition: service_healthy
      veblyss.redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:4000/api/v1/health').status == 200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  veblyss.web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Build-time only — see the comment in Dockerfile.web on why this
        # can't just be a runtime `environment:` entry. Point this at
        # whatever hostname/domain Dokploy (or you) will route to the `api`
        # service — not `http://api:4000`, since this URL is also called
        # directly from the customer's browser, which can't resolve
        # Docker-internal service names.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    environment:
      # Runtime-only, server-side fetches — reaches the api container directly
      # over the compose network instead of round-tripping through public
      # DNS/the Cloudflare Tunnel. Safe to hardcode: same network, every env.
      INTERNAL_API_URL: http://veblyss.api:4000
    ports:
      - "3000"
    depends_on:
      - veblyss.api

  # Optional: only starts with `docker compose --profile tunnel up`. Dokploy
  # already terminates TLS and routes domains through its own Traefik proxy —
  # running a Cloudflare Tunnel in the same stack is redundant with that
  # unless you're deliberately using the tunnel as ingress *instead* of
  # Dokploy's proxy. Decide which one is actually fronting traffic before
  # enabling this; running both is more likely to conflict than help.
  veblyss.cloudflared:
    profiles: ["tunnel"]
    container_name: cloudflare-tunnel
    image: 'cloudflare/cloudflared:latest'
    restart: unless-stopped
    command: 'tunnel --no-autoupdate run'
    environment:
      - 'TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN?set in .env}'

volumes:
  veblyss_pg_data:
